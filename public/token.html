<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REDTECH // Token</title><style>
:root{
  --bg:#0a0a12; --purple1:#6c63ff; --purple2:#8e64e6;
  --border:rgba(255,255,255,0.08); --text:#fff; --muted:#9a9ab0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh; background:#0a0a12;
  background-image: radial-gradient(ellipse at top, rgba(108,99,255,0.18) 0%, transparent 60%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;
  display:flex; justify-content:center; padding:20px;
}
.wrap{width:100%; max-width:400px;}
.top{
  display:flex; justify-content:space-between; align-items:center;
  background:rgba(255,255,255,0.05); backdrop-filter:blur(20px);
  border:1px solid var(--border); border-radius:18px; padding:12px 16px; margin-bottom:18px;
}
.brand{display:flex; gap:10px; align-items:center; color:#8a7cff; font-weight:900; letter-spacing:.12em; font-size:0.8rem}
.brand-mark{width:22px;height:28px; filter:drop-shadow(0 0 6px #6c63ff)}
.brand-mark path:first-child{fill:#8a7cff}.brand-mark path:last-child{fill:#a78bfa}
.brand small{display:block; margin-top:4px; color:var(--muted); font-size:9px; letter-spacing:.08em}
.nav{display:flex; gap:14px}.nav a{color:var(--muted); text-decoration:none; font-size:11px; font-weight:700}.nav a:hover{color:#8a7cff}

main{display:flex; flex-direction:column; gap:16px}
.tag{text-align:center; color:#8a7cff; font-size:10px; letter-spacing:.22em; font-weight:800}
h1{text-align:center; font-size:1.9rem; font-weight:900; line-height:1.1; letter-spacing:-.02em}
h1 span{background:linear-gradient(90deg,var(--purple1),var(--purple2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent}
.intro{min-height:2.8em; text-align:center; color:var(--muted); font-size:0.85rem; line-height:1.6; margin-top:8px}
.intro:after{content:"▋"; margin-left:4px; color:var(--purple1); animation:blink.75s steps(1) infinite}

.card{
  background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.03) 100%);
  backdrop-filter: blur(20px);
  border:1px solid var(--border); border-radius:28px; padding:24px;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
.logo-wrap{display:flex; justify-content:center; margin-bottom:14px}
.logo{width:72px;height:72px;border-radius:50%; background:linear-gradient(135deg,var(--purple1),var(--purple2)); display:flex; align-items:center; justify-content:center; font-size:32px; box-shadow:0 0 30px rgba(108,99,255,0.5)}

.label{display:block; margin-bottom:8px; color:#8a7cff; font-size:10px; letter-spacing:.12em; font-weight:800}
.input{display:flex; align-items:center; background:#15151f; border:1px solid var(--border); border-radius:14px; overflow:hidden}
.input b{padding:14px; color:#8a7cff} input{width:100%; border:0; outline:0; padding:14px; background:transparent; color:#fff; font:inherit}
input:focus{box-shadow:inset 0 0 0 1px #8a7cff}
button{width:100%; margin-top:14px; border:0; border-radius:14px; padding:15px; color:#fff; background:linear-gradient(135deg,var(--purple1),var(--purple2)); font:800 12px ui-monospace; letter-spacing:.08em; cursor:pointer; box-shadow:0 0 20px rgba(108,99,255,0.35)}
button:hover{opacity:.9} button:disabled{opacity:.5; cursor:wait}

.progress{display:none; margin-top:14px; padding:14px; border-radius:14px; border:1px solid var(--border); background:#15151f}
.progress.show{display:block}
.progress-line{display:flex; gap:10px; color:#8a7cff; font-size:11px; font-weight:700}
.cursor{width:8px;height:14px;background:var(--purple1); animation:blink.75s steps(1) infinite}
.progress-bar{height:2px; margin-top:12px; overflow:hidden; background:#1e1e2e}
.progress-bar i{display:block; width:35%; height:100%; background:linear-gradient(90deg,var(--purple1),var(--purple2)); animation:scan 1.1s linear infinite}

.result{margin-top:14px; padding:16px; border-radius:16px; border:1px dashed #8a7cff; background:rgba(108,99,255,0.08); animation:reveal.5s ease both}
.result small{color:#8a7cff; font-size:9px; letter-spacing:.15em; font-weight:800}
.token{display:block; margin-top:10px; color:#fff; font-size:22px; letter-spacing:.08em; word-break:break-all; font-weight:800}
.copy{margin-top:12px; background:transparent; border:1px solid #8a7cff; color:#8a7cff}
.copy:hover{background:#8a7cff; color:#fff}

.plans{margin-top:18px; padding-top:16px; border-top:1px solid var(--border)}
.plans-head{display:flex; justify-content:space-between; font-size:9px; letter-spacing:.12em; font-weight:800; color:#8a7cff}
.payment-state{color:var(--muted); font-size:9px}
.plan-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px}
.plan{padding:12px; border-radius:12px; border:1px solid var(--border); background:#15151f; text-align:center}
.plan strong{display:block; color:#fff; font-size:14px}.plan span{color:var(--muted); font-size:9px; margin-top:4px; display:block}
.plan button{margin-top:8px; padding:8px; font-size:9px; background:transparent; border:1px solid var(--border); color:var(--muted); box-shadow:none; cursor:not-allowed}

.hint{margin-top:12px; color:var(--muted); font-size:11px; line-height:1.5; text-align:center}
.toast{position:fixed; right:16px; bottom:16px; display:none; max-width:calc(100% - 32px); padding:12px 16px; border-radius:12px; border:1px solid #8a7cff; background:#1a1a2e; color:#fff; font-size:12px}
.toast.show{display:block}
@keyframes blink{50%{opacity:0}} @keyframes scan{to{transform:translateX(280%)}} @keyframes reveal{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
</style></head><body><div class="wrap"><header class="top"><div class="brand"><svg class="brand-mark" viewBox="0 0 24 30"><path d="M12 1C13 7 20 9 20 17a8 8 0 0 1-16 0c0-4 2-7 5-10 0 4 2 5 3 6 2-3 1-7 0-12Z"/><path d="M12 13c3 3 4 5 4 7a4 4 0 0 1-8 0c0-2 1-4 4-7Z"/></svg><span>// REDTECH<small>REUSABLE TOKEN TERMINAL</small></span></div><nav class="nav"><a href="/token">TOKEN</a><a href="/code">PAIR CODE</a></nav></header><main><div class="tag">[ NODE 01 / IDENTITY ]</div><h1>Claim your <span>Redtech token.</span></h1><p class="intro" id="rotating-copy"></p><section class="card"><div class="logo-wrap"><div class="logo">⚡</div></div><label class="label" for="phone">PHONE // INTERNATIONAL FORMAT</label><div class="input"><b>+</b><input id="phone" inputmode="tel" autocomplete="tel" placeholder="254 7XX XXX XXX"></div><button id="generate">GENERATE TOKEN //→</button><div id="progress" class="progress"><div class="progress-line"><span class="cursor"></span><span id="progress-text">VALIDATING NUMBER //…</span></div><div class="progress-bar"><i></i></div></div><div id="result" class="result" hidden><small>YOUR REUSABLE REDTECH TOKEN</small><strong id="token" class="token"></strong><button id="copy" class="copy">COPY TOKEN</button><p class="hint">Store this token safely. Reuse it on Pair Code page.</p></div><div class="plans"><div class="plans-head"><small>TOKEN ACCESS PLANS</small><span id="payment-state" class="payment-state">CHECKING PAYMENT STATUS //…</span></div><div class="plan-grid"><div class="plan"><strong>KSh 29</strong><span>7 DAYS</span><button disabled>STK PUSH OFFLINE</button></div><div class="plan"><strong>KSh 49</strong><span>14 DAYS</span><button disabled>STK PUSH OFFLINE</button></div><div class="plan"><strong>KSh 99</strong><span>30 DAYS</span><button disabled>STK PUSH OFFLINE</button></div></div></div></section></main></div><div id="toast" class="toast"></div><script>
const $=s=>document.querySelector(s);const copyLines=["Generate once. Store it safely. Use the same token whenever you need a new WhatsApp pairing code.","Your Redtech token stays yours. Keep it private and reuse it whenever you need a fresh code.","One identity. One saved token. New pairing codes on demand.","Secure the link. Keep the token. Connect Redtech when you are ready."];
(async()=>{const target=$("#rotating-copy");if(!target)return;const reducedMotion=Boolean(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);const typeDelay=reducedMotion?70:42;const clearDelay=reducedMotion?45:24;for(let index=0;;index=(index+1)%copyLines.length){const line=copyLines[index];for(let i=0;i<=line.length;i++){target.textContent=line.slice(0,i);await wait(typeDelay)}await wait(2800);for(let i=line.length;i>=0;i--){target.textContent=line.slice(0,i);await wait(clearDelay)}await wait(420)}})();
function toast(m){$("#toast").textContent=m;$("#toast").classList.add("show");setTimeout(()=>$("#toast").classList.remove("show"),3500)}async function api(url,o){const r=await fetch(url,{headers:{"Content-Type":"application/json"},...o});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d}function wait(ms){return new Promise(r=>setTimeout(r,ms))}function status(m){$("#progress-text").textContent=m;$("#progress").classList.add("show")}async function typewrite(v){const n=$("#token");n.textContent="";for(const c of v){n.textContent+=c;await wait(45)}}$("#generate").onclick=async()=>{const phone=$("#phone").value.trim();if(!phone)return toast("Enter your international phone number.");const b=$("#generate");b.disabled=true;$("#result").hidden=true;const req=api("/api/bot/token",{method:"POST",body:JSON.stringify({phone})});const stages=["VALIDATING NUMBER //…","ENCRYPTING REGISTRATION //…","SECURING REDTECH IDENTITY //…","SYNCING PAIRING SERVICE //…","GENERATING YOUR TOKEN //…","TOKEN READY // REVEALING"];try{for(const m of stages){status(m);await wait(500)}const d=await req;$("#result").hidden=false;await typewrite(d.token||"");toast("Token created. Save it safely.")}catch(e){$("#progress").classList.remove("show");toast(e.message)}finally{b.disabled=false;b.textContent="GENERATE TOKEN //→"}};$("#copy").onclick=async()=>{await navigator.clipboard.writeText($("#token").textContent);toast("Token copied.")};fetch("/api/bot/payment-config").then(r=>r.json()).then(c=>{$("#payment-state").textContent=c.enabled?"MPESA STK PUSH READY":"PAYMENT PLANS COMING SOON"}).catch(()=>{$("#payment-state").textContent="PAYMENT CONFIG UNAVAILABLE"});
</script></body></html>
